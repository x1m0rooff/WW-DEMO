<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WW — компьютерный клуб в Минске</title>
  <meta name="description" content="Компьютерный клуб WW, Минск, ул. Притыцкого, 83. Круглосуточно. Маршрут в Яндекс Картах и 2ГИС.">
  <meta name="theme-color" content="#0e0f12">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="live"><span class="dot" aria-hidden="true"></span>круглосуточно</p>
      <h1>
        <img class="logo" src="logo.png" alt="WW PC Club">
      </h1>
      <p class="kind">компьютерный клуб</p>
      <address>
        Минск, ул. Притыцкого, 83
        <span>метро Кунцевщина · от 5 Br / час</span>
      </address>
    </header>

    <section class="ticket" aria-label="Как добраться и оставить отзыв">
      <h2 class="route">Как добраться /<span> Оставить отзыв</span></h2>
      <div class="stack">
        <a class="go yandex" href="https://yandex.by/maps/org/ww/20424941913/" target="_blank" rel="noopener noreferrer">
          <span>Яндекс Карты</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <p class="go google soon">
          <span>Google Карты <small>скоро появятся</small></span>
        </p>
        <a class="go gis" href="https://2gis.by/minsk/firm/70000001103023474" target="_blank" rel="noopener noreferrer">
          <span>2ГИС</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>

      <h2>Соцсети</h2>
      <div class="stack">
        <a class="go instagram" href="https://www.instagram.com/ww.cyberclub/" target="_blank" rel="noopener noreferrer">
          <span>Instagram</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="go phone" href="tel:+375447282222">
          <span>Позвонить <small>+375 44 728-22-22</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
